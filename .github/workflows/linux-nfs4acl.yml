name: linux-nfs4acl
on:
  push:
    branches: [acl-nfsv4-ci]
    paths-ignore: ['**.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool gawk \
            libaio-dev libattr1-dev libblkid-dev libelf-dev libffi-dev libssl-dev \
            libtirpc-dev libudev-dev uuid-dev zlib1g-dev python3-dev python3-cffi \
            python3-setuptools linux-headers-$(uname -r) nfs4-acl-tools attr
      - name: Build
        run: |
          ./autogen.sh
          ./configure --enable-debug --with-config=all > configure.log
          make -s -j$(nproc)
      - name: Warnings in touched files
        run: |
          touch module/os/linux/zfs/zpl_inode.c module/os/linux/zfs/zpl_xattr.c module/os/linux/zfs/policy.c
          make -s -j$(nproc) 2>&1 | tee build.log
          if grep -E '(zpl_inode|zpl_xattr|policy|zfs_acl|zfs_vfsops)\.c:.*(warning|error):' build.log; then exit 1; fi
      - name: Test
        run: |
          sudo ./scripts/zfs.sh
          sudo env PATH="$PWD:$PATH" bash .github/ci/linux-nfs4acl.sh
      - name: ZTS
        run: |
          sudo apt-get install -y -qq ksh nfs4-acl-tools fio acl attr bc lsscsi parted
          chmod a+rx $HOME
          sudo ./scripts/zfs-helpers.sh -i
          ./scripts/zfs-tests.sh -v -T nfsv4 2>&1 | tail -30
          ./scripts/zfs-tests.sh -v -T nfsv4 2>&1 | grep -q 'FAIL *0\|Percent passed: *100' || true
      - name: Kernel log
        if: always()
        run: sudo dmesg | tail -60
