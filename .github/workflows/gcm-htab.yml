name: gcm-htab

# Load OpenZFS built with kmem tracking, write to a GCM-encrypted pool
# and look for the free-size assertion, at openzfs master and with the
# fix.  Scratch for one report; not for merging.

on:
  push:
    branches: [gcm-htab-test]
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        ref: [master, gcm-htab-len]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.ref == 'master' && 'openzfs/zfs' || 'zakinko/zfs' }}
          ref: ${{ matrix.ref }}
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential autoconf automake libtool \
              gawk libblkid-dev uuid-dev libudev-dev libssl-dev zlib1g-dev \
              libaio-dev libattr1-dev libelf-dev libtirpc-dev libffi-dev \
              python3 python3-dev python3-setuptools python3-cffi \
              linux-headers-$(uname -r)
      - name: Build
        run: |
          git log -1 --format='%H %s'
          ./autogen.sh >/dev/null
          ./configure --enable-debug --enable-debug-kmem \
              --enable-debug-kmem-tracking >/dev/null
          make -j$(nproc) >/dev/null
      - name: Load and exercise GCM
        run: |
          sudo modprobe -r zfs 2>/dev/null || true
          sudo ./scripts/zfs.sh
          cat /sys/module/zfs/parameters/icp_gcm_impl
          grep -m1 -o -w -E 'vaes|avx2|pclmulqdq|aes' /proc/cpuinfo | sort -u | xargs
          T=$RUNNER_TEMP
          truncate -s 512M $T/vdev
          # An SPL assertion leaves the thread that hit it asleep for
          # good, so run the I/O in the background and read the log
          # after a fixed wait instead of waiting for it.
          sudo sh -c "echo passphrase123 | ./zpool create \
              -O encryption=aes-256-gcm -O keyformat=passphrase \
              -O keylocation=prompt tgcm $T/vdev &&
              dd if=/dev/urandom of=/tgcm/f bs=1M count=32 status=none &&
              ./zpool export tgcm && echo IO-DONE" > $T/io.log 2>&1 &
          sleep 90
          cat $T/io.log
          echo "== kernel log"
          sudo dmesg | grep -E -A6 'ASSERT|VERIFY|PANIC' | head -40 || true
          if sudo dmesg | grep -q -E 'ASSERT|VERIFY|PANIC'; then
              echo "RESULT: assertion"; exit 1
          fi
          grep -q IO-DONE $T/io.log && echo "RESULT: clean" || { echo "RESULT: io did not finish"; exit 1; }
